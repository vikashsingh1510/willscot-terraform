name: Terraform Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.tf"
      - ".github/workflows/terraform-test.yml"

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate